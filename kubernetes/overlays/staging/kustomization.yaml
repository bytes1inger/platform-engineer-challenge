apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

replicas:
  - name: api-service
    count: 2

images:
  - name: ghcr.io/acme/api-service
    newTag: v1.2.0

labels:
  - pairs:
      environment: staging
    includeSelectors: false   # add to metadata only — avoids mutating pod selectors
