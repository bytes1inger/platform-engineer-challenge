apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
  labels:
    app: api-service
spec:
  type: ClusterIP   # ingress controller handles external traffic; no per-service cloud LB needed
  selector:
    app: api-service
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
