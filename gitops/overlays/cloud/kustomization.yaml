apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: apps

resources:
  - ../../base/sample-app

configMapGenerator:
  - name: sample-app-config
    behavior: merge
    literals:
      - APP_ENV=cloud

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /metadata/labels/cluster
        value: cloud
    target:
      kind: Deployment
      name: sample-app
  - path: html-patch.yaml
    target:
      kind: ConfigMap
      name: sample-app-html
