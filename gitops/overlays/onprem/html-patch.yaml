apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Palladium Platform Demo</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: #0d1117;
          color: #c9d1d9;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem;
        }
        .card {
          background: #161b22;
          border: 1px solid #30363d;
          border-radius: 12px;
          padding: 2.5rem;
          max-width: 680px;
          width: 100%;
        }
        .tag {
          display: inline-block;
          background: #1a3a1a;
          color: #3fb950;
          font-size: 0.7rem;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          padding: 3px 10px;
          border-radius: 20px;
          border: 1px solid #238636;
          margin-bottom: 1.25rem;
        }
        h1 { font-size: 2rem; font-weight: 700; color: #e6edf3; }
        .sub { color: #8b949e; font-size: 0.95rem; margin-top: 0.4rem; margin-bottom: 2rem; }
        .cluster-block {
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 8px;
          padding: 1.25rem 1.5rem;
          margin-bottom: 2rem;
          display: flex;
          gap: 2rem;
          flex-wrap: wrap;
        }
        .meta { flex: 1; min-width: 120px; }
        .meta-label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.08em; }
        .meta-value { font-size: 1rem; font-weight: 600; color: #3fb950; margin-top: 0.2rem; }
        .section-label { font-size: 0.75rem; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; }
        .pipeline {
          display: flex;
          align-items: center;
          gap: 0.4rem;
          margin-bottom: 2rem;
          flex-wrap: wrap;
        }
        .step {
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 6px;
          padding: 0.9rem 1rem;
          min-width: 110px;
          text-align: center;
          flex: 1;
        }
        .step-icon { font-size: 1.2rem; }
        .step-name { font-size: 0.8rem; font-weight: 600; color: #e6edf3; margin-top: 0.3rem; }
        .step-detail { font-size: 0.7rem; color: #8b949e; margin-top: 0.15rem; }
        .arrow { color: #3fb950; font-size: 1rem; flex-shrink: 0; }
        .stats { display: flex; gap: 1rem; flex-wrap: wrap; }
        .stat {
          background: #0d1117;
          border: 1px solid #30363d;
          border-radius: 6px;
          padding: 0.75rem 1rem;
          flex: 1;
          min-width: 110px;
        }
        .stat-label { font-size: 0.65rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.08em; }
        .stat-value { font-size: 0.9rem; font-weight: 600; color: #3fb950; margin-top: 0.2rem; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="tag">GitOps &bull; On-Prem</div>
        <h1>Palladium Platform</h1>
        <p class="sub">Hybrid cloud &mdash; deployed via ArgoCD from a git push</p>
        <div class="cluster-block">
          <div class="meta">
            <div class="meta-label">Cluster</div>
            <div class="meta-value">k3s &mdash; On-Prem</div>
          </div>
          <div class="meta">
            <div class="meta-label">Overlay</div>
            <div class="meta-value">onprem</div>
          </div>
          <div class="meta">
            <div class="meta-label">Network</div>
            <div class="meta-value">Tailscale</div>
          </div>
          <div class="meta">
            <div class="meta-label">Branch</div>
            <div class="meta-value">platform-demo</div>
          </div>
        </div>
        <div class="section-label">Deployment pipeline</div>
        <div class="pipeline">
          <div class="step">
            <div class="step-icon">&#128196;</div>
            <div class="step-name">Git push</div>
            <div class="step-detail">platform-demo</div>
          </div>
          <div class="arrow">&#8594;</div>
          <div class="step">
            <div class="step-icon">&#128260;</div>
            <div class="step-name">ArgoCD</div>
            <div class="step-detail">on EKS</div>
          </div>
          <div class="arrow">&#8594;</div>
          <div class="step">
            <div class="step-icon">&#9881;&#65039;</div>
            <div class="step-name">Kustomize</div>
            <div class="step-detail">onprem overlay</div>
          </div>
          <div class="arrow">&#8594;</div>
          <div class="step">
            <div class="step-icon">&#9989;</div>
            <div class="step-name">Synced</div>
            <div class="step-detail">self-heal on</div>
          </div>
        </div>
        <div class="stats">
          <div class="stat">
            <div class="stat-label">Sync policy</div>
            <div class="stat-value">Automated</div>
          </div>
          <div class="stat">
            <div class="stat-label">Self-heal</div>
            <div class="stat-value">Enabled</div>
          </div>
          <div class="stat">
            <div class="stat-label">Metrics</div>
            <div class="stat-value">Thanos</div>
          </div>
          <div class="stat">
            <div class="stat-label">Managed by</div>
            <div class="stat-value">ArgoCD</div>
          </div>
        </div>
      </div>
    </body>
    </html>
