apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-cloud
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bytes1inger/platform-engineer-challenge
    targetRevision: platform-demo
    path: gitops/overlays/cloud
  destination:
    server: https://kubernetes.default.svc   # in-cluster (EKS)
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
