apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit-cloud
  namespace: argocd
spec:
  project: eks
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: "0.47.9"
    helm:
      values: |
        config:
          service: |
            [SERVICE]
                Flush         5
                Daemon        Off
                Log_Level     info
                HTTP_Server   On
                HTTP_Listen   0.0.0.0
                HTTP_Port     2020

          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*.log
                Parser            cri
                Tag               kube.*
                Mem_Buf_Limit     50MB
                Skip_Long_Lines   On

          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Kube_URL            https://kubernetes.default.svc:443
                Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                Merge_Log           On
                Keep_Log            Off
                K8S-Logging.Parser  On

          outputs: |
            [OUTPUT]
                Name                   loki
                Match                  *
                Host                   loki.monitoring.svc.cluster.local
                Port                   3100
                Labels                 job=fluent-bit,cluster=eks-af-south-1
                Label_keys             $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name']
                Auto_Kubernetes_Labels On

        tolerations:
          - operator: Exists

        resources:
          requests:
            cpu: 50m
            memory: 50Mi
          limits:
            cpu: 200m
            memory: 200Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
