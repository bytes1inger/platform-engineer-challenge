apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit-onprem
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: "0.47.9"
    helm:
      values: |
        config:
          service: |
            [SERVICE]
                Flush         5
                Daemon        Off
                Log_Level     info
                HTTP_Server   On
                HTTP_Listen   0.0.0.0
                HTTP_Port     2020

          inputs: |
            [INPUT]
                Name              tail
                Path              /var/log/containers/*.log
                Parser            cri
                Tag               kube.*
                Mem_Buf_Limit     50MB
                Skip_Long_Lines   On

          filters: |
            [FILTER]
                Name                kubernetes
                Match               kube.*
                Kube_URL            https://kubernetes.default.svc:443
                Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
                Merge_Log           On
                Keep_Log            Off
                K8S-Logging.Parser  On

          outputs: |
            [OUTPUT]
                Name  stdout
                Match *
                # Production target: AWS OpenSearch in af-south-1 via Direct Connect + TLS
                # Closes the no-TLS ISO 27001 finding on current Fluentd/ELK setup

        tolerations:
          - operator: Exists

        resources:
          requests:
            cpu: 50m
            memory: 50Mi
          limits:
            cpu: 200m
            memory: 200Mi
  destination:
    server: https://100.120.215.34:6443
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
