apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-node-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    targetRevision: "4.39.0"
    helm:
      values: |
        hostRootFsMount:
          enabled: true
        service:
          port: 9100
          targetPort: 9100
        tolerations:
          - operator: Exists
  destination:
    server: https://100.120.215.34:6443
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
