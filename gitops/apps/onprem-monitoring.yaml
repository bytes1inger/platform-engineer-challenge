apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-monitoring
  namespace: argocd
spec:
  project: onprem
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "65.1.1"
    helm:
      values: |
        # k3s does not expose scheduler/controller-manager/etcd metrics
        # on the standard ports kube-prometheus-stack expects
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        # Centralised Grafana and Alertmanager live on EKS
        grafana:
          enabled: false
        alertmanager:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 15d
            externalLabels:
              cluster: omen-onprem
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 5Gi
            thanos:
              objectStorageConfig:
                existingSecret:
                  name: thanos-objstore
                  key: objstore.yml

        nodeExporter:
          enabled: false
  destination:
    server: https://omen.tailf91091.ts.net
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
