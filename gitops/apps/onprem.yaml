apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-onprem
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bytes1inger/platform-engineer-challenge
    targetRevision: platform-demo
    path: gitops/overlays/onprem
  destination:
    server: https://100.120.215.34:6443
    namespace: apps
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
