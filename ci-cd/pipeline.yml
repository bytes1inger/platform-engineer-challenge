# ci-cd/pipeline.yml
# This pipeline has at least 5 bugs and several security issues.
# Find and fix them. Document each change with a comment.

name: Build and Deploy

on:
  push:
    branches: [main]   # image push only on main merges
  pull_request:
    branches: [main]   # build and test on PRs, no push

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: acme/api-service

permissions:
  id-token: write   # required for OIDC JWT request
  contents: write   # required for GitOps commit back to repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2   # outputs registry URL — no hardcoded account ID

      - name: Set IMAGE_URI
        run: |
          echo "IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -t $IMAGE_URI .

      - name: Run tests
        run: npm test

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: '1'          # fail pipeline on CRITICAL findings
          severity: CRITICAL
          ignore-unfixed: true    # skip CVEs with no available fix

      - name: Push image to ECR
        if: github.event_name == 'push'   # skip push on PRs
        run: docker push $IMAGE_URI

      - name: Update staging image tag in kustomization
        if: github.event_name == 'push'
        run: |
          cd kubernetes/overlays/staging
          kustomize edit set image ghcr.io/acme/api-service=$IMAGE_URI
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "chore(gitops): update api-service image to ${{ github.sha }} [skip ci]"
          git push
