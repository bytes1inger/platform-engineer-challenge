# ci-cd/pipeline.yml
# This pipeline has at least 5 bugs and several security issues.
# Find and fix them. Document each change with a comment.

name: Build and Deploy

on:
  push:
    branches: [main]   # image push only on main merges
  pull_request:
    branches: [main]   # build and test on PRs, no push

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: acme/api-service

permissions:
  id-token: write   # required for OIDC JWT request
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # BUG 3: AWS account ID is hardcoded
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin \
            123456789012.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} .

      # BUG 4: Image is pushed before tests run
      - name: Push image to ECR
        run: |
          docker tag $ECR_REPOSITORY:${{ github.sha }} \
            123456789012.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}
          docker push \
            123456789012.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

      - name: Run tests
        run: |
          # BUG 5: Wrong command — this project uses npm, not yarn
          yarn test

      # TODO (Task 3b): Add Trivy vulnerability scan here (fail on CRITICAL)
      # TODO (Task 3c): Add GitOps update step here (push to main only)
